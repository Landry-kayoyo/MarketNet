function addToCart(id,qty=1,variant=""){const p=db.products.find(x=>x.id===id);if(!p)return;const c=cart(),key=id+"|"+variant,found=c.find(x=>x.key===key);if(found)found.qty=Math.min(found.qty+qty,p.stock);else c.push({key,id,qty:Math.min(qty,p.stock),variant});saveCart(c);toast("Produit ajouté au panier.");updateCartButtons()}

function submitOrder(){const c=cart();if(!c.length)return;const first=db.products.find(p=>p.id===c[0].id),s=shop(first?.tenantId);const name=document.getElementById("coName").value.trim(),phone=document.getElementById("coPhone").value.trim(),addr=document.getElementById("coAddress").value.trim();if(!name||!phone){toast("Nom et téléphone sont obligatoires.");return}const lines=c.map(x=>{const p=db.products.find(y=>y.id===x.id);return p?`${x.qty}x ${p.name}${x.variant?` (${x.variant})`:``}`:""}).filter(Boolean);const total=c.reduce((sum,x)=>{const p=db.products.find(y=>y.id===x.id);return sum+(p?p.price*x.qty:0)},0);const msg=encodeURIComponent(`Bonjour ${s.name}, je souhaite commander :\n${lines.join("\n")}\nTotal : ${money(total,"CDF")}\nNom : ${name}\nTéléphone : ${phone}\nAdresse : ${addr||"À préciser"}`);localStorage.removeItem("mk_cart");document.getElementById("checkoutModal")?.remove();window.open("https://wa.me/"+s.whatsapp.replace(/\D/g,"")+"?text="+msg,"_blank");toast("Commande préparée sur WhatsApp.")}

function openLightbox(id,index=0){const p=db.products.find(x=>x.id===id);if(!p)return;const imgs=p.images||[];let i=index;document.body.insertAdjacentHTML("beforeend",`<div class="lightbox" id="lightbox"><button class="btn close" onclick="document.getElementById('lightbox').remove()">×</button><button class="prev" onclick="moveLightbox('${id}',-1)"><i class="bi bi-chevron-left"></i></button><img id="lightboxImg" src="${esc(imgs[i]||"")}" alt="${esc(p.name)}"><button class="next" onclick="moveLightbox('${id}',1)"><i class="bi bi-chevron-right"></i></button></div>`);window._lightbox={id,i}}
function moveLightbox(id,dir){const p=db.products.find(x=>x.id===id),imgs=p?.images||[];if(!imgs.length)return;window._lightbox.i=(window._lightbox.i+dir+imgs.length)%imgs.length;document.getElementById("lightboxImg").src=imgs[window._lightbox.i]}
function productDetail(id){window._detailProductId=id;const p=db.products.find(x=>x.id===id);const s=shop(p?.tenantId);if(!p||!s)return;const imgs=p.images?.length?p.images:[""];const specs=Object.entries(p.specs||{});const reviews=db.reviews.filter(r=>r.productId===p.id);const similar=products(p.tenantId).filter(x=>x.id!==p.id).slice(0,4);const avg=reviews.length?(reviews.reduce((a,r)=>a+r.rating,0)/reviews.length).toFixed(1):"4.8";document.getElementById("root").innerHTML=`<div class="app public-app"><header class="topbar"><button class="btn" onclick="openStore('${s.slug}')"><i class="bi bi-arrow-left"></i><span class="label">Boutique</span></button><button class="brand brand-btn" onclick="goHome()">MarketNet</button><div class="top-actions"><button class="btn cart-pill" onclick="openCart()"><i class="bi bi-bag"></i><span class="label">Panier</span><span class="cart-count" data-cart-count>${cartCount()}</span></button><button class="btn primary" onclick="login()"><i class="bi bi-person-circle"></i><span class="label">Espace commerçant</span></button></div></header><main class="content"><div class="breadcrumbs"><button onclick="goHome()">MarketNet</button><i class="bi bi-chevron-right"></i><button onclick="openStore('${s.slug}')">${esc(s.name)}</button><i class="bi bi-chevron-right"></i><span>${esc(p.name)}</span></div><section class="detail"><div class="detail-media"><button style="border:0;padding:0;background:transparent;width:100%;cursor:zoom-in" onclick="openLightbox('${p.id}',0)"><img id="detailMainImage" class="detail-main-image" src="${esc(imgs[0])}" alt="${esc(p.name)}"></button>${imgs.length>1?`<div class="detail-gallery">${imgs.map((im,i)=>`<button class="detail-thumb ${i===0?"active":""}" onclick="selectDetailImage('${esc(im)}',this);event.stopPropagation()"><img src="${esc(im)}" alt="Vue ${i+1}" style="width:100%;height:100%;object-fit:cover;border-radius:8px"></button>`).join("")}</div>`:""}<p class="muted" style="font-size:11px;text-align:center;margin:8px 0 0"><i class="bi bi-zoom-in"></i> Appuyez sur l’image pour agrandir</p></div><div class="panel detail-info"><span class="tag">${esc(p.category)}</span><h1>${esc(p.name)}</h1><div class="brand-row">${(p.brands||[]).map(b=>`<span class="brand-chip"><i class="bi bi-patch-check"></i> ${esc(b)}</span>`).join("")}</div><div class="rating-summary"><span class="stars">★★★★★</span><strong>${avg}</strong><span class="muted">${reviews.length||12} avis</span></div><div class="price" style="font-size:29px">${money(p.price,p.currency)}</div><div class="muted" style="font-size:12px">${p.stock>0?`✓ En stock · ${p.stock} disponible(s)`:`Indisponible`}</div><p>${esc(p.description||"Produit disponible dans cette boutique.")}</p>${p.variants?.length?`<div class="variant-label">Choisir une variante</div><div class="variant-list" id="variantList">${p.variants.map((v,i)=>`<button class="variant ${i===0?"active":""}" onclick="this.parentElement.querySelectorAll('.variant').forEach(x=>x.classList.remove('active'));this.classList.add('active')">${esc(v)}</button>`).join("")}</div>`:""}<div class="buy-box"><div class="qty-row"><strong>Quantité</strong><div class="qty-control"><button onclick="changeQty(-1)">−</button><input id="detailQty" value="1" inputmode="numeric"><button onclick="changeQty(1)">+</button></div><span class="muted" style="font-size:11px">Max. ${p.stock}</span></div><div class="buy-actions"><button class="btn" onclick="addCurrentToCart('${p.id}')"><i class="bi bi-bag-plus"></i> Ajouter</button><button class="btn primary" onclick="buyNow('${p.id}')">Commander</button></div></div>${specs.length?`<div class="spec-grid">${specs.map(([k,v])=>`<div class="spec"><small>${esc(k)}</small><strong>${esc(v)}</strong></div>`).join("")}</div>`:""}<div class="detail-actions"><button class="btn success" onclick="wa('${s.id}','${p.id}')"><i class="bi bi-whatsapp"></i> Contacter ${esc(s.name)}</button><button class="btn" onclick="openStore('${s.slug}')">Voir la boutique</button></div></div></section><section class="panel" style="margin-top:16px"><div class="head"><div><h3>Avis clients</h3><p>Retours sur ce produit et cette boutique.</p></div><div class="rating-summary"><span class="stars">★★★★★</span><strong>${avg}/5</strong></div></div><div class="review-list">${(reviews.length?reviews:[{customer:"Client vérifié",rating:5,text:"Produit conforme et vendeur réactif."},{customer:"Aline",rating:5,text:"Très bonne qualité, je recommande."}]).map(r=>`<article class="review-card"><div class="review-head"><strong>${esc(r.customer)}</strong><span class="stars">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</span></div><p style="margin:7px 0 0">${esc(r.text)}</p></article>`).join("")}</div></section><section class="section"><div class="section-head"><div><h2>Vous pourriez aussi aimer</h2><p>D’autres produits de ${esc(s.name)}.</p></div><button class="btn" onclick="openStore('${s.slug}')">Voir tout</button></div><div class="similar-grid">${similar.map(x=>`<article class="product-card similar-card"><img src="${esc(x.images?.[0]||"")}" alt="${esc(x.name)}"><div class="product-body"><span class="tag">${esc(x.category)}</span><h3>${esc(x.name)}</h3><div class="price">${money(x.price,x.currency)}</div><button class="btn" onclick="productDetail('${x.id}')">Voir le détail</button></div></article>`).join("")}</div></section></main><button class="whatsapp-float" onclick="wa('${s.id}','${p.id}')"><i class="bi bi-whatsapp"></i><span>WhatsApp</span></button>${publicNav("products")}</div>`}
function changeQty(d){const el=document.getElementById("detailQty");if(!el)return;const p=db.products.find(x=>x.id===window._detailProductId);let n=parseInt(el.value||1)+d;n=Math.max(1,n);el.value=n}
function selectedVariant(){return document.querySelector("#variantList .variant.active")?.textContent.trim()||""}
function addCurrentToCart(id){const q=Math.max(1,parseInt(document.getElementById("detailQty")?.value||1));addToCart(id,q,selectedVariant())}
function buyNow(id){addCurrentToCart(id);setTimeout(openCart,150)}

function selectDetailImage(src,btn){const img=document.getElementById("detailMainImage");if(img)img.src=src;document.querySelectorAll(".detail-thumb").forEach(x=>x.classList.remove("active"));btn.classList.add("active")}

function ensureSession(){if(!sessionStorage.getItem("mk_tenant"))sessionStorage.setItem("mk_tenant","t1")}
function tenant(){ensureSession();return shop(sessionStorage.getItem("mk_tenant"))||db.shops[0]}
function authShell(title,body,active="home"){
const items=[["home","Accueil","bi-grid-1x2-fill"],["orders","Commandes","bi-bag-check"],["products","Produits","bi-box-seam"],["messages","Messages","bi-chat-dots"]];
document.getElementById("root").innerHTML=`<div class="app authenticated-app"><header class="topbar"><button class="brand brand-btn" onclick="dash()">MarketNet</button><div class="public-nav"><strong>${esc(title)}</strong></div><div class="top-actions"><button class="btn primary" onclick="openStore(tenant().slug)"><i class="bi bi-shop"></i><span class="label">Ma boutique</span></button><button class="btn" onclick="moreMenu()"><i class="bi bi-three-dots"></i><span class="label">Plus</span></button></div></header><div class="auth-layout"><aside class="sidebar"><nav class="nav">${items.map(x=>`<button data-page="${x[0]}" class="${active===x[0]?"active":""}" onclick="${x[0]==="home"?"dash()":x[0]==="orders"?"orders()":x[0]==="products"?"merchantProducts()":"messages()"}">${icon(x[2])}<span>${x[1]}</span></button>`).join("")}<div class="nav-more"><button onclick="moreMenu()">${icon("bi-three-dots")}<span>Plus</span></button></div></nav></aside><main class="auth-main"><div class="content">${body}</div></main></div></div>`}
function dash(){const s=tenant(),ps=db.products.filter(p=>p.tenantId===s.id),online=ps.filter(p=>p.status==="visible").length;authShell("Accueil",`<div class="page-head dashboard-head"><div><h1>Bonjour 👋</h1><p>${esc(s.name)} · votre activité en un coup d’œil.</p></div><button class="btn primary" onclick="merchantProducts(true)"><i class="bi bi-plus"></i><span>Ajouter un produit</span></button></div><div class="kpis"><div class="kpi"><span>Produits</span><strong>${ps.length}</strong></div><div class="kpi"><span>En ligne</span><strong>${online}</strong></div><div class="kpi"><span>Visites</span><strong>${db.events.views}</strong></div><div class="kpi"><span>WhatsApp</span><strong>${db.events.clics}</strong></div></div><div class="dash-grid"><section class="panel recent-products"><div class="head"><div><h3>Produits récents</h3><p>Les produits de votre boutique.</p></div><button class="btn" onclick="merchantProducts()">Voir tout</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Produit</th><th>Prix</th><th>Stock</th><th>État</th></tr></thead><tbody>${ps.slice(0,5).map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${money(p.price,p.currency)}</td><td>${p.stock}</td><td><span class="status">${p.status==="visible"?"En ligne":"Masqué"}</span></td></tr>`).join("")}</tbody></table></div><div class="dash-products-mobile">${ps.slice(0,5).map(p=>`<article class="dash-product-row"><div class="dash-product-main"><strong>${esc(p.name)}</strong><span>${money(p.price,p.currency)}</span></div><div class="dash-product-meta"><span>Stock ${p.stock}</span><span class="status">${p.status==="visible"?"En ligne":"Masqué"}</span></div></article>`).join("")||`<p class="muted">Aucun produit.</p>`}</div></section><section class="panel quick-panel"><div class="head"><div><h3>Accès rapide</h3><p>Navigation essentielle.</p></div></div><div class="quick-actions"><button class="btn" onclick="messages()"><i class="bi bi-chat-dots"></i> Messages clients</button><button class="btn" onclick="orders()"><i class="bi bi-bag-check"></i> Commandes</button><button class="btn" onclick="builder()"><i class="bi bi-palette"></i> Ma boutique</button><button class="btn" onclick="analytics()"><i class="bi bi-bar-chart"></i> Analytics</button></div></section></div>`,`home`)}
function merchantProducts(){const s=tenant();const ps=db.products.filter(p=>p.tenantId===s.id);authShell("Produits",`<div class="page-head"><div><h1>Produits</h1><p>Gérez votre catalogue sans multiplier les menus.</p></div><button class="btn primary" onclick="productForm()"><i class="bi bi-plus"></i> Nouveau produit</button></div><input id="mSearch" class="form-input" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;margin-bottom:14px" placeholder="Rechercher..." oninput="renderMerchantProducts()"><div id="merchantGrid" class="product-grid">${merchantCards(ps)}</div>`,"products")}
function merchantCards(ps){return ps.map(p=>`<article class="product-card"><img src="${p.images?.[0]||""}" alt="${esc(p.name)}"><div class="product-body"><span class="tag">${esc(p.category)}</span><h3>${esc(p.name)}</h3><div class="price">${money(p.price,p.currency)}</div><div class="actions"><button class="btn primary" onclick="productForm('${p.id}')">Modifier</button><button class="btn" onclick="toggleProduct('${p.id}')">${p.status==="visible"?"Masquer":"Publier"}</button></div></div></article>`).join("")||`<div class="panel" style="grid-column:1/-1;text-align:center">Aucun produit.</div>`}
function renderMerchantProducts(){const s=tenant(),q=(document.getElementById("mSearch")?.value||"").toLowerCase();document.getElementById("merchantGrid").innerHTML=merchantCards(db.products.filter(p=>p.tenantId===s.id&&(p.name+" "+p.category).toLowerCase().includes(q)))}
function productForm(id=""){const p=db.products.find(x=>x.id===id)||{name:"",price:"",category:"Mode",currency:"CDF",stock:0,description:"",images:[]};document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="modal" style="position:fixed;inset:0;background:#0f172a99;display:grid;place-items:center;padding:20px;z-index:300"><div class="panel" style="width:min(620px,100%);max-height:90vh;overflow:auto"><div class="head"><h2>${id?"Modifier":"Nouveau"} produit</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><label>Nom<input id="fName" value="${esc(p.name)}"></label><label>Prix<input id="fPrice" type="number" value="${p.price}"></label><label>Catégorie<input id="fCat" value="${esc(p.category)}"></label><label>Stock<input id="fStock" type="number" value="${p.stock}"></label><label>Image URL<input id="fImg" value="${esc(p.images?.[0]||"")}"></label><label>Description<textarea id="fDesc">${esc(p.description||"")}</textarea></label><button class="btn primary" onclick="saveProduct('${id}')">Enregistrer</button></div></div></div>`)}
function saveProduct(id){const s=tenant(),old=db.products.find(p=>p.id===id),o={id:id||"p"+Date.now(),tenantId:s.id,name:document.getElementById("fName").value.trim(),price:+document.getElementById("fPrice").value||0,currency:"CDF",category:document.getElementById("fCat").value.trim()||"Autre",stock:+document.getElementById("fStock").value||0,images:[document.getElementById("fImg").value.trim()],description:document.getElementById("fDesc").value.trim(),brands:old?.brands||[],status:old?.status||"visible"};if(!o.name){toast("Le nom est obligatoire.");return}const i=db.products.findIndex(p=>p.id===o.id);i>=0?db.products[i]=o:db.products.unshift(o);save();closeModal();merchantProducts();toast("Produit enregistré.")}
function toggleProduct(id){const p=db.products.find(x=>x.id===id);if(p){p.status=p.status==="visible"?"hidden":"visible";save();merchantProducts()}}
function closeModal(){document.getElementById("modal")?.remove()}
function orders(){const s=tenant(),os=db.orders.filter(o=>o.tenantId===s.id);authShell("Commandes",`<div class="page-head"><div><h1>Commandes</h1><p>Suivez les commandes dans un seul écran.</p></div></div><section class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Commande</th><th>Client</th><th>Montant</th><th>Statut</th></tr></thead><tbody>${os.map(o=>`<tr><td><strong>${esc(o.number)}</strong></td><td>${esc(o.customer)}</td><td>${money(o.total,o.currency||"CDF")}</td><td><span class="status">${esc(o.status)}</span></td></tr>`).join("")||`<tr><td colspan="4" class="muted">Aucune commande pour le moment.</td></tr>`}</tbody></table></div></section>`,"orders")}
function messages(){const s=tenant(),ms=db.messages.filter(m=>m.tenantId===s.id);authShell("Messages",`<div class="page-head"><div><h1>Messages</h1><p>Centralisez les demandes clients.</p></div></div><section class="panel">${ms.map(m=>`<div class="message"><div class="avatar">${esc((m.customer||"C")[0])}</div><div><strong>${esc(m.customer)}</strong><p>${esc(m.text)}</p><small class="muted">${esc(m.date||"Aujourd’hui")}</small></div><button class="btn" onclick="toast('Réponse simulée envoyée.')">Répondre</button></div>`).join("")||`<div style="text-align:center;padding:35px" class="muted">Aucun message.</div>`}</section>`,"messages")}
function analytics(){authShell("Analytics",`<div class="page-head"><div><h1>Analytics</h1><p>Les chiffres essentiels, sans écran inutile.</p></div></div><div class="kpis"><div class="kpi"><span>Visites</span><strong>${db.events.views}</strong></div><div class="kpi"><span>Clics WhatsApp</span><strong>${db.events.clics}</strong></div><div class="kpi"><span>Taux contact</span><strong>${db.events.views?Math.round(db.events.clics/db.events.views*100):0}%</strong></div><div class="kpi"><span>Produits</span><strong>${db.products.filter(p=>p.tenantId===tenant().id).length}</strong></div></div><section class="panel" style="margin-top:14px"><div class="head"><h3>Trafic des 7 derniers jours</h3></div><div style="height:220px;display:flex;align-items:end;gap:10px;padding:15px;border-top:1px solid var(--line)">${[35,52,46,68,58,82,72].map((h,i)=>`<div style="flex:1;height:${h}%;background:linear-gradient(#60a5fa,#2563eb);border-radius:8px 8px 2px 2px;position:relative"><small style="position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);color:#64748b">${["L","M","M","J","V","S","D"][i]}</small></div>`).join("")}</div></section>`,"more")}
function builder(){const s=tenant(),b=s.branding||{};authShell("Ma boutique",`<div class="builder"><section class="grid"><div class="panel"><div class="head"><div><h3>Navigation claire</h3><p>Une seule barre principale + une barre secondaire contextuelle.</p></div><button class="btn primary" onclick="saveBuilder()">Publier</button></div><div class="form"><label>Nom<input id="bName" value="${esc(s.name)}"></label><label>Slogan<input id="bSlogan" value="${esc(b.slogan||"")}"></label><label>Description<textarea id="bDesc">${esc(b.description||"")}</textarea></label><label>WhatsApp<input id="bWa" value="${esc(s.whatsapp||"")}"></label><label>Couleur principale<input id="bColor" type="color" value="${b.primary||"#2563eb"}"></label></div></div><div class="panel"><h3>Sections</h3><p class="muted">Gardez uniquement l’essentiel : En-tête, Produits vedettes, Catalogue, À propos.</p><div class="grid">${["hero","featured","products","about"].map(x=>`<label><input type="checkbox" data-sec="${x}" checked> ${x==="hero"?"En-tête":x==="featured"?"Produits vedettes":x==="products"?"Catalogue":"À propos"}</label>`).join("")}</div></div></section><section class="panel builder-preview"><div class="head"><h3>Aperçu</h3><button class="btn" onclick="openStore('${s.slug}')">Ouvrir</button></div><div class="preview"><div class="preview-cover" style="background:linear-gradient(135deg,${b.primary||"#2563eb"},${b.secondary||"#0f172a"})"><strong style="font-size:23px">${esc(s.name)}</strong></div><div class="preview-body"><h3>${esc(b.slogan||"Votre boutique")}</h3><div class="preview-skeleton"><span></span><span></span><span></span></div></div></div></section></div>`,"more")}
function saveBuilder(){const s=tenant();s.name=document.getElementById("bName").value.trim()||s.name;s.whatsapp=document.getElementById("bWa").value.trim();s.branding={...(s.branding||{}),slogan:document.getElementById("bSlogan").value.trim(),description:document.getElementById("bDesc").value.trim(),primary:document.getElementById("bColor").value};db.tenant=s;save();toast("Boutique mise à jour.");builder()}
function moreMenu(){authShell("Plus",`<div class="page-head"><div><h1>Plus</h1><p>Les outils secondaires sont regroupés ici pour alléger la navigation.</p></div></div><div class="grid" style="grid-template-columns:repeat(2,1fr)"><button class="btn" onclick="builder()"><i class="bi bi-palette"></i> Ma boutique</button><button class="btn" onclick="analytics()"><i class="bi bi-bar-chart"></i> Analytics</button><button class="btn" onclick="reviews()"><i class="bi bi-star"></i> Avis clients</button><button class="btn" onclick="settings()"><i class="bi bi-gear"></i> Paramètres</button><button class="btn" onclick="openStore(tenant().slug)"><i class="bi bi-shop"></i> Voir la boutique</button><button class="btn" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Déconnexion</button></div>`,"more")}
function reviews(){const rs=db.reviews.filter(r=>r.tenantId===tenant().id);authShell("Avis clients",`<div class="page-head"><div><h1>Avis clients</h1><p>Regroupez les retours sans encombrer la barre principale.</p></div></div><section class="panel">${rs.map(r=>`<div class="review"><strong>${esc(r.customer)}</strong><div class="stars">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</div><p>${esc(r.text)}</p></div>`).join("")||'<div class="muted">Aucun avis.</div>'}</section>`,"more")}
function settings(){const s=tenant();authShell("Paramètres",`<div class="page-head"><div><h1>Paramètres</h1><p>Informations du compte commerçant.</p></div></div><section class="panel"><div class="form-grid"><label>Nom<input id="setName" value="${esc(s.name)}"></label><label>WhatsApp<input id="setWa" value="${esc(s.whatsapp||"")}"></label><label>Adresse<input id="setAddr" value="${esc(s.address||"")}"></label><label>Plan<input value="${esc(s.plan||"Free")}" disabled></label></div><br><button class="btn primary" onclick="saveSettings()">Enregistrer</button></section>`,"more")}
function saveSettings(){const s=tenant();s.name=document.getElementById("setName").value.trim()||s.name;s.whatsapp=document.getElementById("setWa").value.trim();s.address=document.getElementById("setAddr").value.trim();save();toast("Paramètres enregistrés.");settings()}
function login(){document.getElementById("root").innerHTML=`<div class="login"><div class="login-card"><div class="logo-big">MarketNet</div><h2>Bienvenue</h2><p class="muted">Connectez-vous à votre espace commerçant.</p><div class="form"><label>E-mail<input id="email" value="demo@marketnet.net"></label><label>Mot de passe<input id="pass" type="password" value="123456"></label><button class="btn primary" onclick="enter()"><i class="bi bi-box-arrow-in-right"></i> Se connecter</button><button class="btn" onclick="goHome()">Retour au marketplace</button><small class="muted">Démo : demo@marketnet.net / 123456</small></div></div></div>`}
function enter(){safeStore.set("mk_session","1");safeStore.set("mk_tenant","t1");dash()}
function logout(){safeStore.remove("mk_session");goHome()}
db.orders=db.orders.length?db.orders:[{id:"o1",tenantId:"t1",number:"MN-1001",customer:"Client Démo",total:145000,currency:"CDF",status:"pending"}];
db.messages=db.messages.length?db.messages:[{id:"m1",tenantId:"t1",customer:"Aline",text:"Bonjour, ce produit est-il encore disponible ?",date:"Aujourd’hui"}];
db.reviews=db.reviews.length?db.reviews:[{id:"r1",tenantId:"t1",customer:"Patrick",rating:5,text:"Très bonne boutique et réponse rapide."}];save();
if(safeStore.get("mk_session"))dash();else home();
</script></body></html>
