/* Système global d’interaction des boutons */
:root{--button-radius:12px;--button-focus:rgba(37,99,235,.24);--button-hover-shadow:0 5px 14px rgba(15,23,42,.09)}
.whatsapp-float{display:none!important}
button:not(:disabled){transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background-color .16s ease,color .16s ease,filter .16s ease}
button:disabled{cursor:not-allowed;opacity:.55}
button:focus-visible{outline:3px solid var(--button-focus);outline-offset:2px}
.btn{border-radius:var(--button-radius);font-weight:750;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background-color .16s ease,color .16s ease,filter .16s ease}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--button-hover-shadow)}
.btn:active:not(:disabled){transform:translateY(0) scale(.985);box-shadow:0 1px 3px rgba(15,23,42,.1)}

.home-shop-location{position:absolute;z-index:1;top:12px;right:12px;padding:7px 10px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(15,23,42,.42);color:#fff;font-size:10px;font-weight:800;backdrop-filter:blur(8px)}

function dash(){const s=tenant(),ps=db.products.filter(p=>p.tenantId===s.id),online=ps.filter(p=>p.status==="visible").length;authShell("Accueil",`<div class="page-head dashboard-head"><div><h1>Bonjour 👋</h1><p>${esc(s.name)} · votre activité en un coup d’œil.</p></div><button class="btn primary" onclick="merchantProducts(true)"><i class="bi bi-plus"></i><span>Ajouter un produit</span></button></div><div class="kpis"><div class="kpi"><span>Produits</span><strong>${ps.length}</strong></div><div class="kpi"><span>En ligne</span><strong>${online}</strong></div><div class="kpi"><span>Visites</span><strong>${db.events.views}</strong></div><div class="kpi"><span>WhatsApp</span><strong>${db.events.clics}</strong></div></div><div class="dash-grid"><section class="panel recent-products"><div class="head"><div><h3>Produits récents</h3><p>Les produits de votre boutique.</p></div><button class="btn" onclick="merchantProducts()">Voir tout</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Produit</th><th>Prix</th><th>Stock</th><th>État</th></tr></thead><tbody>${ps.slice(0,5).map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${money(p.price,p.currency)}</td><td>${p.stock}</td><td><span class="status">${p.status==="visible"?"En ligne":"Masqué"}</span></td></tr>`).join("")}</tbody></table></div><div class="dash-products-mobile">${ps.slice(0,5).map(p=>`<article class="dash-product-row"><div class="dash-product-main"><strong>${esc(p.name)}</strong><span>${money(p.price,p.currency)}</span></div><div class="dash-product-meta"><span>Stock ${p.stock}</span><span class="status">${p.status==="visible"?"En ligne":"Masqué"}</span></div></article>`).join("")||`<p class="muted">Aucun produit.</p>`}</div></section><section class="panel quick-panel"><div class="head"><div><h3>Accès rapide</h3><p>Navigation essentielle.</p></div></div><div class="quick-actions"><button class="btn" onclick="messages()"><i class="bi bi-chat-dots"></i> Messages clients</button><button class="btn" onclick="orders()"><i class="bi bi-bag-check"></i> Commandes</button><button class="btn" onclick="builder()"><i class="bi bi-palette"></i> Ma boutique</button><button class="btn" onclick="analytics()"><i class="bi bi-bar-chart"></i> Analytics</button></div></section></div>`,`home`)}
function merchantProducts(){const s=tenant(),ps=db.products.filter(p=>p.tenantId===s.id),published=ps.filter(p=>p.status==="visible").length;window._merchantProductFilter="all";authShell("Produits",`<div class="page-head merchant-products-head"><div><span class="merchant-page-eyebrow">CATALOGUE DE LA BOUTIQUE</span><h1>Mes produits</h1><p>Retrouvez et gérez facilement tous les articles de ${esc(s.name)}.</p></div><button class="btn primary merchant-primary-action" onclick="productForm()"><i class="bi bi-plus-lg"></i> Ajouter un produit</button></div><section class="merchant-products-toolbar"><label class="merchant-products-search"><i class="bi bi-search"></i><input id="mSearch" placeholder="Rechercher un produit ou une catégorie…" oninput="renderMerchantProducts()"></label><div class="merchant-product-filters" id="merchantProductFilters" aria-label="Filtrer les produits"><button class="active" aria-pressed="true" onclick="setMerchantProductFilter('all',this)"><span>Tous</span><span class="filter-count">${ps.length}</span></button><button aria-pressed="false" onclick="setMerchantProductFilter('visible',this)"><span>En ligne</span><span class="filter-count">${published}</span></button><button aria-pressed="false" onclick="setMerchantProductFilter('hidden',this)"><span>Masqués</span><span class="filter-count">${ps.length-published}</span></button></div></section><div class="merchant-products-results"><strong id="merchantProductCount">${ps.length} produits</strong><span>Le stock et le statut restent modifiables à tout moment.</span></div><div id="merchantGrid" class="product-grid merchant-product-grid">${merchantCards(ps)}</div>`,"products")}
function merchantCards(ps){return ps.map(p=>`<article class="product-card merchant-product-card"><div class="merchant-product-image">${productImageMarkup(p)}<span class="merchant-product-status ${p.status==="visible"?"is-live":"is-hidden"}"><i class="bi ${p.status==="visible"?"bi-check-circle-fill":"bi-eye-slash-fill"}"></i>${p.status==="visible"?"En ligne":"Masqué"}</span></div><div class="product-body"><span class="tag">${esc(p.category)}</span><h3>${esc(p.name)}</h3><div class="price">${money(p.price,p.currency)}</div><div class="merchant-product-meta"><span><i class="bi bi-box-seam"></i> Stock : <strong>${p.stock}</strong></span><span>${(p.brands||[]).length?esc(p.brands[0]):"MarketNet"}</span></div><div class="merchant-product-actions"><button class="btn merchant-edit-action" onclick="productForm('${p.id}')"><i class="bi bi-pencil-square"></i> Modifier</button><button class="btn merchant-toggle-action ${p.status==="visible"?"is-live":"is-hidden"}" onclick="toggleProduct('${p.id}')"><i class="bi ${p.status==="visible"?"bi-eye-slash":"bi-send"}"></i>${p.status==="visible"?"Masquer":"Publier"}</button></div></div></article>`).join("")||`<div class="panel merchant-products-empty" style="grid-column:1/-1"><i class="bi bi-box-seam"></i><strong>Aucun produit trouvé</strong><span>Modifiez la recherche ou ajoutez un nouvel article à votre boutique.</span><button class="btn" onclick="productForm()"><i class="bi bi-plus"></i> Ajouter un produit</button></div>`}
function setMerchantProductFilter(filter,button){window._merchantProductFilter=filter;document.querySelectorAll("#merchantProductFilters button").forEach(item=>{const active=item===button;item.classList.toggle("active",active);item.setAttribute("aria-pressed",String(active))});renderMerchantProducts()}
function renderMerchantProducts(){const s=tenant(),q=(document.getElementById("mSearch")?.value||"").trim().toLowerCase(),filter=window._merchantProductFilter||"all",filtered=db.products.filter(p=>p.tenantId===s.id&&(filter==="all"||p.status===filter)&&(!q||(p.name+" "+p.category+" "+(p.brands||[]).join(" ")).toLowerCase().includes(q)));const grid=document.getElementById("merchantGrid"),count=document.getElementById("merchantProductCount");if(grid)grid.innerHTML=merchantCards(filtered);if(count)count.textContent=q?`${filtered.length} résultat${filtered.length===1?"":"s"}`:`${filtered.length} produit${filtered.length===1?"":"s"}`}
function productForm(id=""){const p=db.products.find(x=>x.id===id)||{name:"",price:"",category:"Mode",currency:"CDF",stock:0,description:"",images:[]};document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="modal" style="position:fixed;inset:0;background:#0f172a99;display:grid;place-items:center;padding:20px;z-index:300"><div class="panel" style="width:min(620px,100%);max-height:90vh;overflow:auto"><div class="head"><h2>${id?"Modifier":"Nouveau"} produit</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><label>Nom<input id="fName" value="${esc(p.name)}"></label><label>Prix<input id="fPrice" type="number" value="${p.price}"></label><label>Catégorie<input id="fCat" value="${esc(p.category)}"></label><label>Stock<input id="fStock" type="number" value="${p.stock}"></label><input id="fImg" type="hidden" value="${esc(p.images?.[0]||"")}"><div class="asset-upload-row" style="margin-top:0"><label class="btn primary asset-import-button" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px"><i class="bi bi-cloud-arrow-up"></i> Importer une image<input class="asset-file" id="fImgFile" type="file" accept="image/png,image/jpeg,image/webp" onchange="uploadProductImage(this)"></label><button class="btn asset-clear-button" type="button" onclick="clearProductImage()"><i class="bi bi-trash3"></i> Supprimer</button></div><div class="upload-help" style="margin-top:6px">Téléchargez directement une image depuis votre appareil. Le lien URL n’est plus nécessaire.</div><div id="fImgPreview" class="asset-cover-preview ${p.images?.[0]?'has-image':''}" style="${p.images?.[0]?`background-image:url('${esc(p.images[0])}')`:""}">${p.images?.[0]?'':'Aucune image'}</div><label>Description<textarea id="fDesc">${esc(p.description||"")}</textarea></label><button class="btn primary" onclick="saveProduct('${id}')">Enregistrer</button></div></div></div>`)}
async function uploadProductImage(input){const file=input?.files?.[0];if(!file)return;try{const data=await compressImageFile(file,1200,1200);const target=document.getElementById("fImg");if(target){target.value=data;const prev=document.getElementById("fImgPreview");if(prev){prev.style.backgroundImage=`url("${data}")`;prev.classList.add("has-image");prev.textContent=""}}toast("Image du produit importée.")}catch(e){console.error(e);toast("Impossible d'importer cette image.")}}
function clearProductImage(){const target=document.getElementById("fImg");const input=document.getElementById("fImgFile");if(target)target.value="";if(input)input.value="";const prev=document.getElementById("fImgPreview");if(prev){prev.style.backgroundImage="";prev.classList.remove("has-image");prev.textContent="Aucune image"}toast("Image supprimée.")}
function saveProduct(id){const s=tenant(),old=db.products.find(p=>p.id===id),img=document.getElementById("fImg").value.trim(),o={id:id||"p"+Date.now(),tenantId:s.id,name:document.getElementById("fName").value.trim(),price:+document.getElementById("fPrice").value||0,currency:"CDF",category:document.getElementById("fCat").value.trim()||"Autre",stock:+document.getElementById("fStock").value||0,images:img?[img]:(old?.images||[]),description:document.getElementById("fDesc").value.trim(),brands:old?.brands||[],status:old?.status||"visible"};if(!o.name){toast("Le nom est obligatoire.");return}const i=db.products.findIndex(p=>p.id===o.id);i>=0?db.products[i]=o:db.products.unshift(o);save();closeModal();merchantProducts();toast("Produit enregistré.")}

function toggleProduct(id){const p=db.products.find(x=>x.id===id);if(p){p.status=p.status==="visible"?"hidden":"visible";save();merchantProducts()}}
